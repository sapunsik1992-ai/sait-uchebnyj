<!-- 🚀 AI-ПОМОЩНИК (ЛОКАЛЬНЫЙ РЕЖИМ) -->
<div id="assistant-widget" class="assistant-widget">
    <div class="assistant-handle">
        <span>🤖 ИИ-помощник</span>
        <button id="assistant-toggle" type="button">💬</button>
    </div>
    <div id="assistant-panel" class="assistant-panel hidden">
        <div class="assistant-header">Чат-помощник</div>
        <div id="assistant-messages" class="assistant-messages">
            <div class="assistant-message assistant-bot">Привет! Я — ИИ-помощник. Спроси меня что-нибудь 😊</div>
        </div>
        <form id="assistant-form" class="assistant-form">
            <input id="assistant-input" type="text" placeholder="Напиши вопрос..." autocomplete="off" />
            <button type="submit">Отправить</button>
        </form>
    </div>
</div>

<style>
    .assistant-widget {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 9999;
        width: 360px;
        max-width: calc(100% - 40px);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .assistant-handle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(135deg, #4F46E5, #7C3AED);
        color: white;
        padding: 12px 16px;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    .assistant-handle:hover { transform: scale(1.02); transition: transform 0.2s; }
    .assistant-panel {
        margin-top: 10px;
        background: white;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
        display: flex;
        flex-direction: column;
        height: 480px;
        max-height: 80vh;
    }
    .assistant-panel.hidden {
        display: none;
    }
    .assistant-header {
        background: #2c3e50;
        color: white;
        padding: 14px 16px;
        font-weight: bold;
    }
    .assistant-messages {
        padding: 16px;
        overflow-y: auto;
        flex: 1;
        background: #f7f9fc;
    }
    .assistant-message {
        margin-bottom: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        line-height: 1.5;
        word-wrap: break-word;
    }
    .assistant-bot {
        background: #e8f0ff;
        color: #1a1a2e;
    }
    .assistant-user {
        background: linear-gradient(135deg, #4F46E5, #7C3AED);
        color: white;
        align-self: flex-end;
    }
    .assistant-form {
        display: flex;
        gap: 10px;
        padding: 14px;
        background: #fff;
        border-top: 1px solid #e1e5ee;
    }
    .assistant-form input {
        flex: 1;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid #ccd6e0;
        outline: none;
        font-size: 14px;
    }
    .assistant-form button {
        background: #3498db;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
    }
    .assistant-form button:hover {
        background: #2c81b7;
    }
    .assistant-form button:disabled {
        background: #ccc;
        cursor: not-allowed;
    }
</style>

<script>
// ───────────────────────────────────────────
// Логика работы виджета (ЛОКАЛЬНЫЙ РЕЖИМ)
// ───────────────────────────────────────────
(function() {
    var panel = document.getElementById('assistant-panel');
    var toggle = document.getElementById('assistant-toggle');
    var form = document.getElementById('assistant-form');
    var input = document.getElementById('assistant-input');
    var messages = document.getElementById('assistant-messages');

    if (!panel || !toggle || !form || !input || !messages) {
        return;
    }

    function toggleModal(show) {
        panel.classList.toggle('hidden');
        if (show) input.focus();
    }

    toggle.addEventListener('click', function() {
        toggleModal(true);
    });

    // Функция получения CSRF-токена
    function getCookie(name) {
        var cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    form.addEventListener('submit', function(event) {
        event.preventDefault();
        var text = input.value.trim();
        if (!text) return;

        // Добавляем сообщение пользователя
        var userMessage = document.createElement('div');
        userMessage.className = 'assistant-message assistant-user';
        userMessage.textContent = text;
        messages.appendChild(userMessage);
        messages.scrollTop = messages.scrollHeight;
        input.value = '';

        // Показываем загрузку
        var botMessage = document.createElement('div');
        botMessage.className = 'assistant-message assistant-bot';
        botMessage.textContent = '⏳ Ищу ответ...';
        messages.appendChild(botMessage);
        messages.scrollTop = messages.scrollHeight;

        // Отправляем запрос к локальному бэкенду
        var csrftoken = getCookie('csrftoken');
        var formData = new URLSearchParams();
        formData.append('question', text);

        fetch('/assistant/api/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrftoken || ''
            },
            body: formData.toString()
        })
        .then(function(response) {
            if (!response.ok) {
                throw new Error('Ошибка связи. Попробуйте позже.');
            }
            return response.json();
        })
        .then(function(data) {
            var answer = data.answer || 'ИИ не дал ответ.';
            botMessage.textContent = answer;
            messages.scrollTop = messages.scrollHeight;
        })
        .catch(function(error) {
            console.error('Assistant error:', error);
            botMessage.textContent = '❌ Ошибка связи. Попробуйте позже.';
            messages.scrollTop = messages.scrollHeight;
        });
    });
})();
</script>
<!-- 🚀 КОНЕЦ: AI-ПОМОЩНИК -->
