<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебные модули</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        .banner {
            width: 100%;
            height: 300px;
            background-image: url('{% static "main/banner.png" %}');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .banner h1 {
            color: white;
            font-size: 48px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .module-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: #333;
        }
        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }
        .module-card-icon {
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .module-card-icon img {
            width: 100px;
            height: 100px;
        }
        .module-card-content {
            padding: 20px;
        }
        .module-card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .module-card-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h1>Добро пожаловать в учебный портал</h1>
    </div>

    <div class="container">
        <h2>Доступные модули</h2>
        <div class="modules-grid">
            {% for module in modules %}
                <a href="{% url 'module_detail' module.id %}" class="module-card">
                    <div class="module-card-icon">
                        <img src="{% static 'main/module-icon.webp' %}" alt="{{ module.title }}">
                    </div>
                    <div class="module-card-content">
                        <div class="module-card-title">{{ module.title }}</div>
                        <div class="module-card-description">{{ module.description }}</div>
                    </div>
                </a>
            {% endfor %}
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Учебный портал. Все права защищены.</p>
    </footer>
</body>
</html>
